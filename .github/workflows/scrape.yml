name: minuty

on:
  schedule:
    # A quick check every 10 minutes (a few seconds when there is nothing to do). It does a full
    # run when the last one is 3 hours old, or when the web page asked (Scrape now / Retry post).
    # GitHub sometimes starts these late or skips some; the check makes up for that.
    - cron: '*/10 * * * *'
  workflow_dispatch: # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  RUN_EVERY_MINUTES: '180'
  # Public by design (like a website's address); every data call also needs DATA_PASSWORD.
  SUPABASE_URL: https://fcaeqtmyysbvbaanvzxr.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_lKQBOh5O9H-rLXR1DEk4vA_nT7CTVqk
  DATA_PASSWORD: ${{ secrets.DATA_PASSWORD }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Anything to do?
        id: check
        run: node src/check.mjs

      - name: Cache Playwright browser
        if: steps.check.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ hashFiles('package-lock.json') }}

      - if: steps.check.outputs.go == 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape, rewrite, post
        if: steps.check.outputs.go == 'true'
        run: node src/scrape.mjs
        env:
          SOURCE_URL: ${{ secrets.SOURCE_URL }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          SOURCE_EMAIL: ${{ secrets.SOURCE_EMAIL }}
          SOURCE_PASSWORD: ${{ secrets.SOURCE_PASSWORD }}
          AUTO_UNLOCK: ${{ vars.AUTO_UNLOCK || 'true' }}
          MAX_UNLOCKS_PER_RUN: ${{ vars.MAX_UNLOCKS_PER_RUN || '0' }}
          WINDOW_HOURS: ${{ vars.WINDOW_HOURS || '24' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}
          TARGET_PASSWORD: ${{ secrets.TARGET_PASSWORD }}
          AUTO_POST: ${{ vars.AUTO_POST || 'true' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '0' }}

      # GitHub pauses scheduled workflows after 60 days without commits, so a main run
      # touches a heartbeat file once a week.
      - name: Weekly heartbeat
        if: steps.check.outputs.due == 'true'
        run: |
          f=.github/heartbeat
          last=$(cat $f 2>/dev/null || echo 0)
          now=$(date -u +%s)
          if [ $((now - last)) -gt 604800 ]; then
            echo $now > $f
            git config user.name "scraper-bot"
            git config user.email "actions@users.noreply.github.com"
            git add $f && git commit -m "heartbeat" && git push
          fi
